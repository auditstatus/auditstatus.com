name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec xo
      # The registry's files, and its table in README.md.
      - run: node scripts/cli.js registry validate
      - run: node scripts/cli.js registry readme --check

  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      # The tests run the attester against real processes, a software TPM,
      # a real sshd with a forced command, and local git repositories.
      - name: Install swtpm, tpm2-tools and OpenSSH
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools openssh-client openssh-server git

      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile

      # The container tests run this image and serve it from a local registry.
      - name: Pull the test image
        run: docker pull alpine:3.20

      # As root, like the attester's forced command with CAP_SYS_PTRACE, so
      # the ownership checks on configuration files are exercised too.
      # c8 enforces 100% statement, branch, function and line coverage.
      - name: Test with coverage
        run: sudo -E env "PATH=$PATH" pnpm run coverage

      - name: Coveralls
        if: matrix.node-version == '22.x'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  binary:
    name: Single executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build-binary.sh

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
