{{- if .Values.networkPolicy.enabled }}
# No traffic to or from the attester pods: the verifier's port-forward
# connects inside the pod's network namespace, which NetworkPolicy does not
# filter, and the attester makes no connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "attester.name" . }}
  labels:
    {{- include "attester.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "attester.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
{{- end }}
